quarkus.application.name=pgmq-integration-tests

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PGMQ_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=${PGMQ_TEST_USER:postgres}
quarkus.datasource.password=${PGMQ_TEST_PASSWORD:postgres}

# Keep the run quiet but leave the extension's own lifecycle visible.
quarkus.log.category."dev.dotnomi.pgmq".level=INFO
